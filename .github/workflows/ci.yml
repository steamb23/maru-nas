# main으로의 push와 모든 PR을 make check(lint·test)와 make build로 검사하고, 문서 사이트(docs/)가 빌드되는지 본다.
# 도구 버전은 CLAUDE.md "명령어"의 요구 사항을 따른다: Go는 backend/go.mod, Node.js는 22(Vitest 5 공식 지원).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 같은 브랜치·PR에 새 커밋이 오면 이전 실행을 취소한다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # 아이콘 서브모듈(vendor/icons/colloid)도 받는다. .gitmodules의 shallow 설정을 따른다
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          # 설치기는 별도 모듈이다(installer/go.mod의 go 버전은 backend/go.mod와 같게 둔다)
          cache-dependency-path: |
            backend/go.sum
            installer/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Lint and test
        run: make check

      - name: Build
        run: make build

  # docs/en/·docs/ko/를 zensical.toml·zensical.ko.toml로 빌드해 깨진 링크·앵커를 찾는다(--strict는 경고도 실패로 본다).
  # 배포는 하지 않는다
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # 알파(0.0.x)라 며칠마다 새 버전이 나오므로 고정한다. 올릴 때는 CONTRIBUTING.md의 미리보기 명령도 함께 고친다
      - name: Install Zensical
        run: pip install zensical==0.0.71

      # 영어(zensical.toml)와 한국어(zensical.ko.toml) 사이트를 따로 빌드한다
      - name: Build docs
        run: |
          zensical build --strict
          zensical build --strict -f zensical.ko.toml
