packages:
  - path: "onmaru/backend/internal/api"
    output_path: "../frontend/src/api/types.gen.ts"
    # 업그레이드 상태(UpgradeInfo.status)와 설치 기록(installed)은 backend/config의 형식을 그대로 넘긴다(아래 upgrade.gen.ts).
    type_mappings:
      config.UpgradeStatus: "config.UpgradeStatus"
      config.InstallRecord: "config.InstallRecord"
    frontmatter: |
      // 원본: backend/internal/api
      // `make types`로 다시 생성한다.
      import type * as config from './upgrade.gen'
  - path: "onmaru/backend/config"
    output_path: "../frontend/src/api/upgrade.gen.ts"
    # 대시보드에서 업그레이드의 파일 형식만 내보낸다(설정 검사·환경 변수 키는 넣지 않는다).
    include_files:
      - "upgrade.go"
      - "upgrade_request.go"
    frontmatter: |
      // 원본: backend/config(upgrade.go, upgrade_request.go). 대시보드에서 업그레이드의 상태 파일 형식이다.
      // `make types`로 다시 생성한다.
