# 마루 NAS 문서 사이트(Zensical). 문서 원본은 docs/이고 GitHub에서도 그대로 읽힌다.
# 미리보기: zensical serve, 검사: zensical build --strict (CONTRIBUTING.md의 "Documentation")
# 배포: stable을 push하면 .github/workflows/docs.yml이 GitHub Pages에 올린다

[project]
site_name = "Maru NAS"
site_description = "A suspiciously normal desktop-like dashboard for openmediavault."
site_url = "https://steamb23.github.io/maru-nas/"
repo_url = "https://github.com/steamb23/maru-nas"
repo_name = "steamb23/maru-nas"
# github.com 저장소의 기본값은 master 브랜치라 직접 둔다
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "site"
# 영어 문서(*.md)가 기본이고, 한국어 문서(*.ko.md)는 "한국어" 아래에 같은 순서로 둔다
nav = [
  { "Introduction" = "README.md" },
  { "Installation and operation" = [
    "install.md",
    "install-options.md",
    "upgrade.md",
    "reverse-proxy.md",
    "configuration.md",
  ] },
  { "Features" = [
    "settings-app.md",
    "files.md",
    "terminal.md",
  ] },
  { "Security" = [
    "helper.md",
    "security.md",
    "passkey-login.md",
  ] },
  { "한국어" = [
    { "소개" = "README.ko.md" },
    { "설치와 운영" = [
      "install.ko.md",
      "install-options.ko.md",
      "upgrade.ko.md",
      "reverse-proxy.ko.md",
      "configuration.ko.md",
    ] },
    { "기능" = [
      "settings-app.ko.md",
      "files.ko.md",
      "terminal.ko.md",
    ] },
    { "보안" = [
      "helper.ko.md",
      "security.ko.md",
      "passkey-login.ko.md",
    ] },
  ] },
]

# 머리글의 언어 선택은 각 언어의 첫 페이지로 간다. 같은 페이지의 다른 언어는 본문 첫 줄에서 잇는다
[[project.extra.alternate]]
name = "English"
link = "/maru-nas/"
lang = "en"

[[project.extra.alternate]]
name = "한국어"
link = "/maru-nas/README.ko/"
lang = "ko"

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.copy",
  "navigation.footer",
  "navigation.sections",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# 이 키를 두면 기본 확장 묶음 대신 아래만 쓴다(toc·tables·superfences는 항상 들어간다).
# docs/는 GitHub에서도 읽혀야 하므로 GitHub가 그리지 못하는 문법(!!!, ===, 속성 목록)의 확장은 켜지 않는다.
[project.markdown_extensions]
toc.permalink = true
# 기본 slugify는 한글을 지워 앵커가 _1, _2가 된다. GitHub처럼 한글을 남긴다
toc.slugify.object = "pymdownx.slugs.slugify"
toc.slugify.kwds.case = "lower"
# GitHub 알림(> [!NOTE])을 사이트에서도 상자로 그린다
pymdownx.quotes.callouts = true
pymdownx.highlight = {}
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
