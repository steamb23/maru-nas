<svg xmlns="http://www.w3.org/2000/svg" width="209.77" height="80" viewBox="0 0 209.77 80">
  <!-- 온마루 묶음 로고: 로고(maru.svg) + 이름 "온마루" + 로마자 표기 "Onmaru". README 머리 등 글자와 함께 보여 줄 때 쓴다.
       글꼴은 Pretendard(SIL OFL 1.1)이고 글자는 윤곽선 path로 바꿨다. "온"은 Light에 파랑, "마루"는 Bold로 "마루"를 강조한다.
       로고 80 기준으로 이름(40, 자간 0.12em) 잉크의 세로 중심을 로고 타일 중심에 맞추고, "Onmaru"(13, 자간 0.08em)는
       이름 잉크 1.5 아래에 두어 아래 끝이 로고 타일 아래 끝(75) 위에 오게 했다. 글자색은 prefers-color-scheme을 따른다 -->
  <style>.o{fill:#3c84f7}.n{fill:#1f2328}.r{fill:#5b636e}@media (prefers-color-scheme: dark){.o{fill:#5c9cff}.n{fill:#e6e8eb}.r{fill:#9aa3ad}}</style>
