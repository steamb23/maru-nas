<svg xmlns="http://www.w3.org/2000/svg" width="213.49" height="80" viewBox="0 0 213.49 80">
  <!-- 마루 NAS 묶음 로고: 로고(maru.svg) + 이름 "마루"·"NAS" + 로마자 표기 "Maru". README 머리 등 글자와 함께 보여 줄 때 쓴다.
       글꼴은 Pretendard(SIL OFL 1.1)이고 글자는 윤곽선 path로 바꿨다. 로고 80 기준으로 "마루"(Bold 40, 자간 0.12em)는 잉크 왼쪽을 94에,
       잉크의 세로 중심을 로고 타일 중심(40)에 맞춘다. "NAS"(SemiBold 18, 자간 0.06em, 파랑)는 "마루" 잉크 오른쪽에서 7 띄우고 세로 중심을
       같게 둔다. "Maru"(13, 자간 0.08em)는 "마루" 잉크 1.5 아래에 가운데를 맞춘다. 폭은 오른쪽 끝 잉크 + 5다.
       글자색은 prefers-color-scheme을 따른다 -->
  <style>.a{fill:#3c84f7}.n{fill:#1f2328}.r{fill:#5b636e}@media (prefers-color-scheme: dark){.a{fill:#5c9cff}.n{fill:#e6e8eb}.r{fill:#9aa3ad}}</style>
