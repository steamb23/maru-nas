<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="./_maru/maru.css" />
    <link rel="stylesheet" href="./style.css" />
    <script src="./_maru/sdk.js"></script>
  </head>
  <body>
    <main class="addon-window">
      <p class="addon-banner notice" id="notice"></p>
      <p class="addon-hint" id="hint"></p>

      <!-- 프레임 샌드박스는 폼 제출을 막으므로(allow-forms 없음) <form> 대신 단추를 직접 처리한다. -->
      <div class="probe-options">
        <span id="network-label"></span>
        <label><input type="checkbox" id="net-lan" /> lan</label>
        <label><input type="checkbox" id="net-loopback" /> loopback</label>
        <label><span id="lan-label"></span> <input type="text" id="lan-address" placeholder="192.168.0.1:80" autocomplete="off" /></label>
        <button type="button" class="addon-button primary" id="run"></button>
      </div>

      <p class="addon-banner" id="error" hidden></p>
      <p id="summary" hidden></p>
      <table class="probe-table" id="table" hidden>
        <thead>
          <tr>
            <th id="col-check"></th>
            <th id="col-target"></th>
            <th id="col-result"></th>
            <th id="col-class"></th>
            <th id="col-expect"></th>
            <th id="col-verdict"></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </main>
    <script type="module" src="./window.js"></script>
  </body>
</html>
