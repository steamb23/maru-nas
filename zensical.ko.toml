# 마루 NAS 한국어 문서 사이트(Zensical). 원본은 docs/ko/이고 site/ko/에 빌드한다. 설명은 zensical.toml의 머리 주석을 본다
# 두 파일은 언어에 따른 항목(이름, 주소, 원본·빌드 위치, 목차, 화면 문구)만 다르고 나머지는 같게 둔다

[project]
site_name = "마루 NAS"
site_description = "A suspiciously normal desktop-like dashboard for openmediavault."
site_url = "https://steamb23.github.io/maru-nas/ko/"
repo_url = "https://github.com/steamb23/maru-nas"
repo_name = "steamb23/maru-nas"
# github.com 저장소의 기본값은 master 브랜치라 직접 둔다
edit_uri = "edit/main/docs/ko/"
docs_dir = "docs/ko"
site_dir = "site/ko"
nav = [
  { "소개" = "README.md" },
  { "설치와 운영" = [
    "install.md",
    "install-options.md",
    "upgrade.md",
    "reverse-proxy.md",
    "configuration.md",
  ] },
  { "기능" = [
    "settings-app.md",
    "files.md",
    "terminal.md",
    "system-updates.md",
  ] },
  { "보안" = [
    "helper.md",
    "security.md",
    "passkey-login.md",
  ] },
]

# 머리글의 언어 선택(zensical.toml과 같게 둔다). 두 사이트의 페이지 이름이 같으므로 보던 페이지의 다른 언어로 간다
[[project.extra.alternate]]
name = "English"
link = "/maru-nas/en/"
lang = "en"

[[project.extra.alternate]]
name = "한국어"
link = "/maru-nas/ko/"
lang = "ko"

[project.theme]
language = "ko"
features = [
  "content.action.edit",
  "content.code.copy",
  "navigation.footer",
  "navigation.sections",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "밝은 화면으로"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "어두운 화면으로"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "시스템 설정 따르기"

# 이 키를 두면 기본 확장 묶음 대신 아래만 쓴다(toc·tables·superfences는 항상 들어간다).
# docs/는 GitHub에서도 읽혀야 하므로 GitHub가 그리지 못하는 문법(!!!, ===, 속성 목록)의 확장은 켜지 않는다.
[project.markdown_extensions]
toc.permalink = true
# 기본 slugify는 한글을 지워 앵커가 _1, _2가 된다. GitHub처럼 한글을 남긴다
toc.slugify.object = "pymdownx.slugs.slugify"
toc.slugify.kwds.case = "lower"
# GitHub 알림(> [!NOTE])을 사이트에서도 상자로 그린다
pymdownx.quotes.callouts = true
pymdownx.highlight = {}
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
