# 마루 NAS 한국어 문서 사이트(Zensical). docs/*.ko.md만 site-ko/에 빌드하고, 배포할 때 영어 사이트(zensical.toml)의 ko/ 아래로 옮긴다.
# 설명은 zensical.toml의 머리 주석을 본다
# 두 파일은 언어에 따른 항목(이름, 주소, 목차, 화면 문구)만 다르고 나머지는 같게 둔다

[project]
site_name = "마루 NAS"
site_description = "A suspiciously normal desktop-like dashboard for openmediavault."
site_url = "https://steamb23.github.io/maru-nas/ko/"
repo_url = "https://github.com/steamb23/maru-nas"
repo_name = "steamb23/maru-nas"
# github.com 저장소의 기본값은 master 브랜치라 직접 둔다
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "site-ko"
# 영어 문서는 zensical.toml이 빌드한다(gitignore 형식: 모든 .md를 빼고 .ko.md만 다시 넣는다)
exclude_docs = """
*.md
!*.ko.md
"""
nav = [
  { "소개" = "README.ko.md" },
  { "설치와 운영" = [
    "install.ko.md",
    "install-options.ko.md",
    "upgrade.ko.md",
    "reverse-proxy.ko.md",
    "configuration.ko.md",
  ] },
  { "기능" = [
    "settings-app.ko.md",
    "files.ko.md",
    "terminal.ko.md",
  ] },
  { "보안" = [
    "helper.ko.md",
    "security.ko.md",
    "passkey-login.ko.md",
  ] },
]

# 사이트 주소(/maru-nas/ko/)로 들어오면 소개 페이지로 보낸다. README.ko.md는 첫 페이지(index)로 쓰이지 않는다
[project.plugins.redirects.redirect_maps]
"index.md" = "README.ko.md"

# 머리글의 언어 선택. 각 언어 사이트의 첫 페이지로 간다(zensical.toml과 같게 둔다)
[[project.extra.alternate]]
name = "English"
link = "/maru-nas/"
lang = "en"

[[project.extra.alternate]]
name = "한국어"
link = "/maru-nas/ko/"
lang = "ko"

[project.theme]
language = "ko"
features = [
  "content.action.edit",
  "content.code.copy",
  "navigation.footer",
  "navigation.sections",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "밝은 화면으로"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "어두운 화면으로"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "시스템 설정 따르기"

# 이 키를 두면 기본 확장 묶음 대신 아래만 쓴다(toc·tables·superfences는 항상 들어간다).
# docs/는 GitHub에서도 읽혀야 하므로 GitHub가 그리지 못하는 문법(!!!, ===, 속성 목록)의 확장은 켜지 않는다.
[project.markdown_extensions]
toc.permalink = true
# 기본 slugify는 한글을 지워 앵커가 _1, _2가 된다. GitHub처럼 한글을 남긴다
toc.slugify.object = "pymdownx.slugs.slugify"
toc.slugify.kwds.case = "lower"
# GitHub 알림(> [!NOTE])을 사이트에서도 상자로 그린다
pymdownx.quotes.callouts = true
pymdownx.highlight = {}
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
